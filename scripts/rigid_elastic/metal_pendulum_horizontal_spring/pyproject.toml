[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["appearance", "asset_tools", "edits", "model", "pipeline", "scene_config", "scene_paths", "tools", "validation"]
